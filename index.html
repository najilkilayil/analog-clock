<!DOCTYPE html>
<html>
    <head>
        <title>Analog Clock</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="https://th.bing.com/th/id/OIP.j7R4sriItmunF3F-7L0t7AHaHa?w=194&h=194&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" type="image/png">
    </head>
    <!--
        Planning Crazy

    >> Circle shaped analog clock
    >> Black background
    >> Hour, Minute, Second needle using HTML and CSS
    >> Make it move.

    -->
<body>
    <!-- Add clock -->
    <div class="analog-clock">
        <!-- Hour Needle -->
         <div class="hour-needle">
            <div class="hr" id="hr"></div>
         </div>

        <!-- Minute Needle -->
         <div class="minute-needle">
            <div class="min" id="min"></div>
         </div>

        <!-- Second Needle -->
        <div class="second-needle">
            <div class="sec" id="sec"></div>
        </div>
    </div>
</body>
</html>
